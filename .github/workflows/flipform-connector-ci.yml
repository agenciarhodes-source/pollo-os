name: Flip OS — connector checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flip-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, Typecheck and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_SECRET: local-ci-only-secret-not-for-production-32characters
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit and database-isolation tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
