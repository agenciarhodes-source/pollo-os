<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Pollo OS · Pollo CEO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: workspace executivo — sidebar compacta, topbar com estado das fontes, conversa no centro, painel de contexto à direita (recolhível). Tema claro único, por identidade Pollo. */
:root{
  /* Cor */
  --bg:#FAF9F6; --surface:#FFFFFF; --sand:#F4F0E9; --sand-2:#ECE6DC;
  --line:#E8E2D8; --line-2:#D8CFC2;
  --ink:#2B201B; --ink-2:#5F534C; --ink-3:#8E8279;
  --brand:#CA6E23; --brand-ink:#94500F; --brand-soft:#F9EDE1;
  --ff:#2F6FB8; --ff-soft:#E8F0FA; --ff-ink:#245A98;
  --fi:#2E8A68; --fi-soft:#E6F3EE; --fi-ink:#226B50;
  --ff-bg:#F6F9FD; --fi-bg:#F5FAF7;
  --ok:#2C7A57; --ok-soft:#E5F2EB; --warn:#9C640A; --warn-soft:#FBF1DC; --err:#B53A30; --err-soft:#FAE8E6; --gray-soft:#EFEBE5;
  --white:#FFFFFF; --bezel:#2B201B;
  /* Tipo */
  --font-d:'Manrope','Segoe UI',system-ui,sans-serif;
  --font-b:'Inter','Segoe UI',system-ui,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,Consolas,monospace;
  /* Forma */
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(43,32,27,.04),0 4px 14px rgba(43,32,27,.04);
  --shadow-lg:0 16px 48px rgba(43,32,27,.16);
  --stick:40px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-b);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;color:var(--ink);text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}.ico.xs{width:13px;height:13px}.ico.lg{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-m);font-size:12px}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- Faixa de prévia ---------- */
#pv{position:sticky;top:0;z-index:60;height:var(--stick);background:var(--ink);color:#EDE5DB;overflow-x:auto;scrollbar-width:none}
#pv::-webkit-scrollbar{display:none}
.pv-in{height:100%;display:flex;align-items:center;gap:14px;white-space:nowrap;min-width:max-content;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px}
.pv-tag{display:flex;align-items:center;gap:8px;font-weight:600}
.pv-tag i{width:7px;height:7px;border-radius:2px;background:var(--brand);transform:rotate(45deg)}
.pv-sep{width:1px;height:18px;background:rgba(237,229,219,.2)}
.pv-btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;color:#EDE5DB}
.pv-btn:hover,.pv-btn[aria-pressed="true"]{background:rgba(237,229,219,.14)}
.pv-btn b{color:#F2B67E}
.roteiro{position:fixed;top:calc(var(--stick) + 8px);right:16px;z-index:70;width:330px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:14px;display:grid;gap:8px}
.rt{display:flex;align-items:center;gap:10px;font-size:13px;padding:4px 0}
.rt .c{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:var(--white);font-size:11px;font-weight:700}
.rt.done .c{background:var(--ok);border-color:var(--ok)}
.rt.done span{color:var(--ink-3);text-decoration:line-through}

/* ---------- Palco / celular ---------- */
.stage{min-height:calc(100vh - var(--stick))}
.stage.phone{display:flex;justify-content:center;align-items:flex-start;padding:24px 16px 40px;background:var(--sand-2)}
.phone-frame{width:390px;max-width:100%;height:min(844px,calc(100vh - var(--stick) - 48px));border:10px solid var(--bezel);border-radius:46px;overflow:hidden;transform:translateZ(0);background:var(--bg);box-shadow:var(--shadow-lg)}
.phone-scroll{height:100%;overflow-y:auto;overflow-x:hidden}
.phone .app{--stick:0px}
.app{min-height:calc(100vh - var(--stick));position:relative}
.phone .app{min-height:100%}

/* ---------- Componentes base ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700}
.card-h .sub{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--gray-soft);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.err{background:var(--err-soft);color:var(--err)}
.chip.brand{background:var(--brand-soft);color:var(--brand-ink)}.chip.ff{background:var(--ff-soft);color:var(--ff-ink)}.chip.fi{background:var(--fi-soft);color:var(--fi-ink)}
.chip.line{background:transparent;border:1px solid var(--line-2)}
.chip.dash{background:transparent;border:1px dashed var(--line-2);color:var(--ink-3)}
.src{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.src i{width:8px;height:8px;border-radius:2px;display:block;flex:none}
.src.off{border-style:dashed;color:var(--ink-3)}
button.src:hover{border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,filter .15s,border-color .15s}
.btn.primary{background:var(--brand);color:var(--white)}.btn.primary:hover{filter:brightness(.94)}
.btn.dark{background:var(--ink);color:var(--white)}
.btn.line{border:1px solid var(--line-2);background:var(--surface)}.btn.line:hover{background:var(--sand)}
.btn.ghost:hover{background:var(--sand)}
.btn.ok{background:var(--ok);color:var(--white)}.btn.danger{border:1px solid var(--err);color:var(--err);background:var(--surface)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn.xs{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.locked{background:var(--gray-soft);color:var(--ink-3);border:1px dashed var(--line-2)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.icon-btn:hover{background:var(--sand);color:var(--ink)}
.icon-btn .badge{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--white);background:var(--ink-2);flex:none}
.avatar.sm{width:24px;height:24px;font-size:10px}
.seg{display:inline-flex;background:var(--sand);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(43,32,27,.1)}
.tbl-wrap{overflow-x:auto;margin:0 -20px -20px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-align:left;font-weight:700;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;padding:9px 16px;background:var(--sand);white-space:nowrap}
td{padding:10px 16px;border-top:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
.field{display:grid;gap:6px}
.field label,.field .fl{font-size:12.5px;font-weight:600}
.inp{height:38px;border:1px solid var(--line-2);border-radius:9px;padding:0 12px;background:var(--surface);width:100%}
textarea.inp{height:auto;min-height:76px;padding:10px 12px;resize:vertical}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{accent-color:var(--brand);width:16px;height:16px}

/* Marcadores epistêmicos */
.ep{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.ep.fato{background:var(--ink);color:var(--white)}
.ep.hip{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}
.ep.rec{background:var(--brand-soft);color:var(--brand-ink)}
.ep.dec{background:var(--ok-soft);color:var(--ok)}
.ep.exe{background:var(--ff-soft);color:var(--ff-ink)}
.ep.prop{background:var(--gray-soft);color:var(--ink-2)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - var(--stick))}
.phone .shell{min-height:100%}
.side{position:sticky;top:var(--stick);height:calc(100vh - var(--stick));background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 12px}
.logo{width:30px;height:30px;border-radius:9px;border:2px solid var(--brand);display:grid;place-items:center;flex:none}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--brand);display:block}
.brand .n{font-family:var(--font-d);font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand .n em{font-style:normal;color:var(--brand)}
.ws{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:auto}
.co-sel{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px}
.co-sel:hover{background:var(--sand)}
.co-sel .co{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--white);font-weight:700;font-size:11px;flex:none}
.co-sel .t1{font-weight:600;font-size:13px;line-height:1.2}.co-sel .t2{font-size:11.5px;color:var(--ink-3)}
.nav{display:grid;gap:1px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;font-size:13px;white-space:nowrap;color:var(--ink-2);position:relative}
.nav-i:hover{background:var(--sand);color:var(--ink)}
.nav-i.cur{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav-i .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--brand);color:var(--white);border-radius:999px;padding:0 7px;line-height:18px}
.nav-i .v2{margin-left:auto;font-size:10px;font-weight:700;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:5px;padding:0 5px}
.side-foot{margin-top:auto;display:grid;gap:1px;padding-top:10px;border-top:1px solid var(--line)}
.app-link .dot{width:10px;height:10px;border-radius:3px;display:block;flex:none}
.plan{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);padding:8px 10px}
.user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px}
.user .t1{font-size:13px;font-weight:600;line-height:1.2}.user .t2{font-size:11.5px;color:var(--ink-3)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:var(--stick);z-index:30;min-height:64px;background:rgba(250,249,246,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px}
.top .ttl{min-width:0}
.top .crumb{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl{flex:0 1 auto;min-width:120px}
.top h1{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.sync{display:flex;gap:6px;align-items:center}
.cmdk{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;color:var(--ink-3);font-size:13px}
.cmdk kbd{font-family:var(--font-m);font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--sand)}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:55;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px}
.dd-menu.left{left:0;right:auto}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font-size:13px}
.dd-item:hover,.dd-item.cur{background:var(--sand)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 320px;align-items:start;flex:1}
.body.noctx{grid-template-columns:minmax(0,1fr)}
.center{padding:28px 32px 48px;min-width:0;display:grid;gap:20px;align-content:start}
.ctx{position:sticky;top:calc(var(--stick) + 64px);max-height:calc(100vh - var(--stick) - 64px);overflow-y:auto;border-left:1px solid var(--line);background:var(--surface);padding:20px;display:grid;gap:20px;align-content:start}
.ctx h4{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.ctx-sec{display:grid;gap:10px}
.mini-f{display:grid;grid-template-columns:82px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:12px}
.mini-f .t{height:6px;border-radius:4px;background:var(--sand);overflow:hidden}
.mini-f .t i{display:block;height:100%;background:var(--ff);border-radius:4px}
.kv2{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
.kv2:first-child{border-top:0}
.focus-i{display:grid;gap:4px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:12.5px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h h2{font-size:24px;font-weight:800}
.page-h p{color:var(--ink-2);margin-top:4px;font-size:13.5px;max-width:70ch}
.ill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:999px;padding:2px 9px;white-space:nowrap}

/* ---------- Visão executiva ---------- */
.hello h2{font-size:28px;font-weight:800;line-height:1.15}
.hello p{color:var(--ink-2);margin-top:6px;font-size:14.5px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.ask-fake{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1.5px solid var(--line-2);border-radius:14px;color:var(--ink-3);font-size:15px;background:var(--bg)}
.ask-fake:hover{border-color:var(--brand)}
.ask-fake .go{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--white);display:grid;place-items:center}
.qs{display:flex;gap:8px;flex-wrap:wrap}
.q{font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-align:left}
.q:hover{border-color:var(--brand);color:var(--brand-ink)}
.changed{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding-top:12px;border-top:1px solid var(--line)}
.brief{display:grid;gap:0;padding:0;overflow:hidden}
.brief-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ins{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:16px;padding:16px 20px;border-top:1px solid var(--line);align-items:start}
.ins:first-of-type{border-top:0}
.ins .k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.ins .k i{width:8px;height:8px;border-radius:2px;display:block}
.ins .t{font-weight:600;font-size:14px}
.ins .d{font-size:13px;color:var(--ink-2);margin-top:3px}
.ins .s{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;min-width:0}
.kpi .k{font-size:12px;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;gap:6px}
.kpi .v{font-family:var(--font-d);font-weight:800;font-size:24px;line-height:1.1}
.kpi .d{font-size:11.5px;font-weight:600}
.kpi .d.up{color:var(--ok)}.kpi .d.dn{color:var(--err)}
.kpi .exp{font-size:12px;color:var(--ink-2);background:var(--bg);border-radius:8px;padding:8px}
.kpi .f{font-size:11px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lvl{display:grid;gap:8px;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.lvl .n{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.lvl b{font-family:var(--font-d);font-size:15px}
.lvl .bar{height:4px;border-radius:4px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qa{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.qa:hover{border-color:var(--brand)}
.qa .tile{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.qa .t1{font-weight:600;font-size:13.5px}.qa .t2{font-size:12px;color:var(--ink-2)}

/* ---------- Conversa CEO ---------- */
.chat-col{max-width:820px;width:100%;margin:0 auto;display:grid;gap:18px;align-content:start}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.m-u{justify-self:end;max-width:78%;background:var(--ink);color:var(--white);padding:11px 15px;border-radius:16px 16px 4px 16px;font-size:14px}
.m-u .att{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.m-u .att span{font-size:11.5px;background:rgba(255,255,255,.14);border-radius:6px;padding:2px 7px}
.m-a{display:grid;gap:12px;grid-template-columns:34px minmax(0,1fr)}
.ceo-av{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--white);display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:12px}
.ans{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:0;overflow:hidden;min-width:0}
.ans-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.ans-top b{font-size:13px}
.sec{border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;font-weight:700;font-size:13.5px}
.sec-h .chev{margin-left:auto;transition:transform .2s;color:var(--ink-3)}
.sec-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sec-b{padding:0 16px 14px;display:grid;gap:10px;font-size:13.5px}
.sec-b ul,.sec-b ol{margin:0;padding-left:18px;display:grid;gap:6px}
.evi{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.evi-r{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.evi-r:first-child{border-top:0}
.evi-r .delta{font-weight:600}
.hyp{border:1px dashed var(--warn);background:#FFFCF5;border-radius:10px;padding:12px;display:grid;gap:6px}
.hyp b{font-size:13.5px}
.caveat{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);background:var(--sand);border-radius:9px;padding:9px 11px}
.ans-act{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
.ans-act .btn.done{color:var(--ok);border-color:var(--ok)}
.thinking{display:grid;gap:8px;padding:16px}
.sk{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--sand) 0%,var(--sand-2) 50%,var(--sand) 100%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.composer-wrap{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(250,249,246,0),var(--bg) 30%);z-index:20}
.composer{background:var(--surface);border:1.5px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);padding:10px 10px 8px 14px;display:grid;gap:6px}
.composer:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.composer textarea{border:0;outline:0;resize:none;min-height:44px;max-height:140px;background:transparent;width:100%;font-size:14.5px;line-height:1.45}
.composer .tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.composer .tools .sp{flex:1}
.rec-on{color:var(--err)!important;background:var(--err-soft)!important}
.att-row{display:flex;gap:6px;flex-wrap:wrap}
.att-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--sand);border-radius:7px;padding:3px 6px 3px 9px}
.empty-chat{text-align:center;display:grid;gap:12px;justify-items:center;padding:28px 12px}
.empty-chat .ceo-av{width:52px;height:52px;border-radius:15px;font-size:16px}

/* ---------- Reuniões ---------- */
.meet{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.agenda{display:grid;gap:4px;position:sticky;top:calc(var(--stick) + 84px)}
.ag-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;width:100%;color:var(--ink-2)}
.ag-i .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sand);flex:none}
.ag-i.cur{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.ag-i.cur .n{background:var(--brand);color:var(--white)}
.ag-i.done .n{background:var(--ok);color:var(--white)}
.live-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--ink);color:#EDE5DB;border-radius:14px}
.live-bar .rec{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.live-bar .rec i{width:9px;height:9px;border-radius:50%;background:#E0675B;display:block;animation:pulse 1.4s infinite}
.live-bar .rec.paused i{animation:none;background:#8E8279}
@keyframes pulse{50%{opacity:.3}}
.live-bar .ctl{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(237,229,219,.1)}
.live-bar .ctl:hover{background:rgba(237,229,219,.2)}
.live-bar .ctl.on{background:var(--brand);color:var(--white)}
.live-bar .sp{flex:1}
.tr{display:grid;gap:14px}
.tr-l{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;font-size:14px}
.tr-l .who{font-size:12px;font-weight:700;color:var(--ink-3);padding-top:2px}
.tr-l .who.ceo{color:var(--brand-ink)}
.ev-card{border:1px solid var(--line);border-left:3px solid var(--ff);border-radius:10px;padding:12px;background:var(--surface);display:grid;gap:8px;font-size:13px}
.ata{display:grid;gap:16px}
.ata-sec{display:grid;gap:8px}
.ata-sec h4{font-size:14px;display:flex;align-items:center;gap:8px}
.ata-sec ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px}

/* ---------- Agentes ---------- */
.tree{display:grid;gap:18px;justify-items:center;padding:8px 0}
.tree-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%;position:relative}
.node{display:grid;gap:4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:170px;text-align:left;box-shadow:var(--shadow)}
.node:hover{border-color:var(--ink-3)}
.node .lv{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.node b{font-family:var(--font-d);font-size:14px}
.node.v2{border-style:dashed;box-shadow:none;background:var(--bg)}
.tree-link{width:2px;height:16px;background:var(--line-2)}
.branch{display:grid;gap:10px;justify-items:center;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.branch .kids{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.kid{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.kid.v2{border-style:dashed;color:var(--ink-3);background:transparent}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.flt select{height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 8px;background:var(--surface);font-size:12.5px}
.ag-list{display:grid;gap:10px}
.ag-c{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.4fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.ag-c:hover{border-color:var(--ink-3)}
.ag-c .t1{font-weight:700;font-size:13.5px}.ag-c .t2{font-size:12px;color:var(--ink-2)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;display:block}
.flow{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.fl-s{display:grid;gap:6px;min-width:132px;flex:1;position:relative;padding-right:12px}
.fl-s .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--line-2);background:var(--surface);z-index:1}
.fl-s::before{content:"";position:absolute;top:12px;left:26px;right:0;height:2px;background:var(--line-2)}
.fl-s:last-child::before{display:none}
.fl-s.ok .dot{background:var(--ok);border-color:var(--ok);color:var(--white)}
.fl-s.ok::before{background:var(--ok)}
.fl-s.wait .dot{border-color:var(--warn);color:var(--warn)}
.fl-s.block .dot{border-style:dashed;color:var(--ink-3)}
.fl-s b{font-size:12.5px}.fl-s span{font-size:11.5px;color:var(--ink-3)}

/* ---------- Intelligence ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--font-b)}
.cmp{display:grid;gap:9px}
.cmp-r{display:grid;grid-template-columns:96px minmax(0,1fr) 74px;gap:10px;align-items:center;font-size:12.5px}
.cmp-b{display:grid;gap:3px}
.cmp-b i{display:block;height:7px;border-radius:4px}
.money{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mo{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;gap:6px;align-content:start}
.mo.off{border-style:dashed;background:var(--bg)}
.mo .v{font-family:var(--font-d);font-weight:800;font-size:20px}
.mo .def{font-size:12px;color:var(--ink-2)}
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acc-i{border-top:1px solid var(--line)}
.acc-i:first-child{border-top:0}
.acc-b{padding:0 16px 12px;font-size:13px;color:var(--ink-2)}
.legend2{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend2 i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ---------- Memória ---------- */
.wiz{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.wz{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:10px;font-size:12.5px;white-space:nowrap;color:var(--ink-2);border:1px solid transparent}
.wz .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sand);flex:none}
.wz.done .n{background:var(--ok);color:var(--white)}
.wz.cur{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.wz.cur .n{background:var(--brand);color:var(--white)}
.lib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mem{display:grid;gap:10px;align-content:start}
.mem h4{font-size:14.5px}
.mem dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.mem dt{color:var(--ink-3)}.mem dd{margin:0;text-align:right;font-weight:500}

/* ---------- Decisões ---------- */
.kb-wrap{overflow-x:auto;margin:0 -32px;padding:0 32px 6px}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;min-width:min-content}
.kb-col{background:var(--sand);border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start;min-height:160px}
.kb-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;padding:2px 4px 4px}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px;display:grid;gap:8px;text-align:left;width:100%}
.dc:hover{border-color:var(--ink-3)}
.dc .id{font-family:var(--font-m);font-size:11px;color:var(--ink-3)}
.dc .t{font-weight:600;font-size:13.5px;line-height:1.35}
.dc .m{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--ink-2)}
.dc.crit{border-left:3px solid var(--err)}
.audit{display:grid;gap:0}
.au{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line)}
.au:first-child{border-top:0}
.confirm{border:1px solid var(--line-2);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.confirm.ok{border-color:var(--ok);background:var(--ok-soft)}
.confirm.err{border-color:var(--err);background:var(--err-soft)}
.blocked{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--gray-soft);border:1px dashed var(--line-2);font-size:13px;color:var(--ink-2)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px;margin:0}
.dl dt{color:var(--ink-3)}.dl dd{margin:0}

/* ---------- Integrações & Consumo ---------- */
.conns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.conn{display:grid;gap:10px;align-content:start}
.conn .tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--white);flex:none}
.conn.off .tile{background:var(--sand-2)!important;color:var(--ink-3)}
.meter{position:relative;height:14px;border-radius:8px;background:var(--sand);overflow:visible;margin:8px 0 22px}
.meter>i{display:block;height:100%;border-radius:8px;background:var(--brand)}
.meter .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-3)}
.meter .mk span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink-3);white-space:nowrap}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:12.5px}
.hbar .t{height:8px;border-radius:5px;background:var(--sand);overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--brand);border-radius:5px}
.sim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sim-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.so{padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.so .v{font-family:var(--font-d);font-weight:800;font-size:22px}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:13px}
.switch .track{width:36px;height:20px;border-radius:999px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"] .track{background:var(--brand)}
.switch[aria-checked="true"] .track::after{transform:translateX(16px)}
.switch[disabled]{opacity:.55;cursor:not-allowed}

/* ---------- Guia / vazio / gate ---------- */
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:40px 20px;border:1px dashed var(--line-2);border-radius:16px;background:var(--surface)}
.empty .tile{width:52px;height:52px;border-radius:15px;background:var(--sand);color:var(--ink-3);display:grid;place-items:center}
.empty h3{font-size:18px}
.empty p{max-width:52ch;color:var(--ink-2)}
.sw{display:flex;align-items:center;gap:10px;font-size:12.5px}
.sw i{width:28px;height:28px;border-radius:8px;display:block;border:1px solid var(--line);flex:none}
.guide{display:grid;gap:16px;max-width:980px}
.guide h3{font-size:16px;margin-bottom:8px}
.guide ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px}
.tok{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* ---------- Sobreposições ---------- */
.scrim{position:fixed;inset:0;background:rgba(43,32,27,.3);z-index:70}
.drawer{position:fixed;top:var(--stick);right:0;bottom:0;width:440px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:75;display:flex;flex-direction:column;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(20px);opacity:.5}}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.drawer-h b{font-size:16px;font-family:var(--font-d)}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px;display:grid;gap:16px;align-content:start}
.drawer-f{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap}
.modal-wrap{position:fixed;inset:0;z-index:76;display:grid;place-items:center;padding:20px}
.modal{width:min(620px,100%);max-height:calc(100% - 24px);overflow-y:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);border:1px solid var(--line);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.5}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.modal-h b{font-size:17px;font-family:var(--font-d)}
.modal-b{padding:18px 22px;display:grid;gap:14px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cmd{position:fixed;top:calc(var(--stick) + 70px);left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));z-index:76;background:var(--surface);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden}
.cmd input{width:100%;border:0;border-bottom:1px solid var(--line);height:52px;padding:0 18px;font-size:15px;outline:0}
.cmd-list{max-height:360px;overflow-y:auto;padding:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--white);padding:11px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,10px);opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:80%;overflow-y:auto;z-index:75;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:upsheet .22s ease-out}
@keyframes upsheet{from{transform:translateY(30px);opacity:.6}}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:4px auto 12px}
.sheet .ctx{position:static;max-height:none;border:0;padding:0}
.drawer .ctx{position:static;max-height:none;border:0;flex:1;overflow-y:auto}
.mob{display:none!important}
.fade{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}

/* ---------- Login e acesso ---------- */
.login{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:calc(100vh - var(--stick))}
.phone .login{min-height:100%}
.lg-l{background:var(--sand);border-right:1px solid var(--line);padding:48px 64px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.lg-l h1{font-size:40px;line-height:1.08;font-weight:800;max-width:13ch}
.lg-l .lead{font-size:16px;color:var(--ink-2);max-width:44ch;margin-top:14px}
.eco{display:grid;gap:10px;max-width:470px}
.eco-r{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.eco-r .tile,.tile-app{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--white);flex:none}
.eco-r b{font-family:var(--font-d);font-size:14.5px}
.eco-r span{font-size:12.5px;color:var(--ink-2)}
.lg-r{display:flex;align-items:center;justify-content:center;padding:48px 32px}
.lg-form{width:min(400px,100%);display:grid;gap:16px}
.lg-form h2{font-size:26px;font-weight:800}
.pwd{position:relative}
.pwd .inp{padding-right:46px}
.pwd .icon-btn{position:absolute;right:2px;top:1px}
.err-msg{font-size:12.5px;color:var(--err);display:flex;gap:6px;align-items:center}
.inp.bad{border-color:var(--err)}
.alert-box{display:flex;gap:10px;padding:12px;border-radius:10px;background:var(--err-soft);color:var(--err);font-size:13px;align-items:flex-start}
.deep{display:flex;gap:10px;padding:12px;border-radius:10px;background:var(--brand-soft);color:var(--brand-ink);font-size:13px;align-items:flex-start}
.ready{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:24px}
.ready-box{display:grid;justify-items:center;gap:14px;text-align:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--sand-2);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ws-page{max-width:920px;margin:0 auto;padding:48px 24px;display:grid;gap:24px;width:100%}
.ws-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ws-card{display:grid;gap:14px;align-content:start}
.ws-card .co{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--white);font-weight:800;font-family:var(--font-d)}
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hub-c{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow);min-width:0}
.hub-c .band{height:5px}
.hub-c .in{padding:20px;display:grid;gap:12px;flex:1;align-content:start}
.hub-c .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--white)}
.hub-c h3{font-size:19px;font-weight:800}
.hub-c .tg{font-size:13px;font-weight:600}
.hub-c ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.hub-c .foot{padding:14px 20px;border-top:1px solid var(--line);background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hub-c.lock .tile{background:var(--sand-2)!important;color:var(--ink-3)}
.hub-c.lock .band{background:var(--line)!important}
.hub-c.lock h3,.hub-c.lock .tg{color:var(--ink-3)!important}
.myapps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.myapp{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;text-align:left}
.myapp:hover{border-color:var(--ink-3)}
.myapp .t1{font-weight:700;font-size:14px}.myapp .t2{font-size:12px;color:var(--ink-2)}
.myapp.lock .tile-app{background:var(--sand-2)!important;color:var(--ink-3)}
.sw-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:13px;white-space:nowrap;flex:none}
.sw-btn:hover{background:var(--sand)}
.sw-btn .tile-app{width:24px;height:24px;border-radius:7px}
.sw-menu{width:350px;max-width:calc(100vw - 32px);padding:8px}
.sw-i{display:flex;gap:12px;align-items:center;width:100%;padding:10px;border-radius:10px;text-align:left}
.sw-i:hover,.sw-i.cur{background:var(--sand)}
.sw-i .t1{font-weight:700;font-size:13.5px}.sw-i .t2{font-size:12px;color:var(--ink-2)}
.sw-i.lock .tile-app{background:var(--sand-2)!important;color:var(--ink-3)}
.sw-foot{border-top:1px solid var(--line);margin-top:6px;padding:10px 10px 4px;font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.nav-sec{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px}
.nav-i .dot{width:10px;height:10px;border-radius:3px;display:block;flex:none;margin:0 4px}
.nav-i .lk{margin-left:auto;color:var(--ink-3)}
.prof-pop{position:fixed;top:calc(var(--stick) + 8px);right:16px;z-index:70;width:360px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:14px;display:grid;gap:10px}
.prof{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;border:1px solid var(--line);text-align:left;width:100%}
.prof[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.prof .t1{font-weight:700;font-size:13.5px}.prof .t2{font-size:12px;color:var(--ink-2)}
.rt-h{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:6px}
/* App shell compartilhado (FlipForm / Flip Intelligence) */
.gbar{position:sticky;top:var(--stick);z-index:35;height:52px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 16px}
.gtab{height:52px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.gtab:hover{color:var(--ink)}
.gtab.cur{color:var(--ink);font-weight:700}
.gtab i{width:8px;height:8px;border-radius:2px;display:block}
.gtab.lock{color:var(--ink-3)}
.gbar .sp{flex:1}
.ashell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - var(--stick) - 52px)}
.phone .ashell{min-height:calc(100% - 52px)}
.aside{position:sticky;top:calc(var(--stick) + 52px);height:calc(100vh - var(--stick) - 52px);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;z-index:34}
.ff .aside{background:var(--ff-bg)}.fi .aside{background:var(--fi-bg)}
.abrand{display:flex;gap:10px;align-items:center;padding:2px 6px 14px}
.abrand .n{font-family:var(--font-d);font-weight:800;font-size:16px;line-height:1.15}
.abrand .s{font-size:11.5px;color:var(--ink-3)}
.ff .nav-i.cur{background:var(--ff-soft);color:var(--ff-ink)}
.fi .nav-i.cur{background:var(--fi-soft);color:var(--fi-ink)}
.ahead{border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface)}
.ahead h1{font-size:20px;font-weight:800}
.ff .ahead{box-shadow:inset 0 3px 0 var(--ff)}.fi .ahead{box-shadow:inset 0 3px 0 var(--fi)}
.acontent{padding:22px 28px 48px;display:grid;gap:18px;align-content:start;min-width:0}
.concept{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);background:var(--sand);border:1px dashed var(--line-2);border-radius:10px;padding:9px 12px}
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr);padding:0;overflow:hidden;min-height:470px}
.conv-l{border-right:1px solid var(--line)}
.conv{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.conv.cur{background:var(--ff-soft)}
.conv .t1{font-weight:600;font-size:13px}.conv .t2{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-b{flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:78%;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--ff-soft);border-color:transparent}
.msg.sug{align-self:flex-end;background:var(--surface);border:1px dashed var(--ff);color:var(--ff-ink)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.task:first-child{border-top:0}
.task.done .t{text-decoration:line-through;color:var(--ink-3)}
.task input{accent-color:var(--ff);width:17px;height:17px}
.agenda-r{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.agenda-r:first-child{border-top:0}
.fchat{display:grid;gap:12px}
.fb-u{justify-self:end;max-width:80%;background:var(--ink);color:var(--white);padding:10px 14px;border-radius:14px 14px 4px 14px;font-size:13.5px}
.fb-a{max-width:88%;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--fi);padding:12px 14px;border-radius:4px 14px 14px 14px;font-size:13.5px;display:grid;gap:8px}
.quota{display:grid;gap:6px;font-size:12px;color:var(--ink-2)}
.quota .t{height:6px;border-radius:4px;background:var(--sand);overflow:hidden}
.quota .t i{display:block;height:100%;background:var(--fi)}
.ctx-chip{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;background:rgba(255,255,255,.14);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.opening{position:fixed;inset:0;z-index:80;background:rgba(250,249,246,.9);display:grid;place-items:center}

/* ---------- Responsivo (classes calculadas pela largura do app) ---------- */
.lt1280 .body{grid-template-columns:minmax(0,1fr)}
.lt1280 .body>.ctx{display:none}
.lt1280 .ctx-btn{display:inline-grid!important}
.lt1280 .lib,.lt1280 .conns{grid-template-columns:1fr 1fr}
.lt1280 .money{grid-template-columns:1fr 1fr}

.lt1100 .sync{display:none}
.lt1100 .ag-c{grid-template-columns:minmax(0,1fr) auto}
.lt1100 .ag-c .hide-md{display:none}
.lt1100 .kpis{grid-template-columns:1fr 1fr}
.lt860 .shell{grid-template-columns:minmax(0,1fr)}
.lt860 .side{position:fixed;top:var(--stick);left:0;bottom:0;height:auto;width:min(272px,86%);transform:translateX(-102%);transition:transform .22s;box-shadow:var(--shadow-lg)}
.lt860 .side.open{transform:none;z-index:72}
.lt860 .mob{display:inline-grid!important}
.lt860 .desk{display:none!important}
.lt860 .top{padding:8px 12px;gap:6px;min-height:56px}
.lt860 .top h1{font-size:16px}
.lt860 .center{padding:18px 16px 32px}
.lt860 .kb-wrap{margin:0 -16px;padding:0 16px 6px}
.lt860 .two,.lt860 .levels,.lt860 .quick,.lt860 .lib,.lt860 .conns,.lt860 .sim,.lt860 .sim-out,.lt860 .tok{grid-template-columns:minmax(0,1fr)}
.lt860 .meet{grid-template-columns:minmax(0,1fr)}
.lt860 .agenda{position:static;display:flex;overflow-x:auto;gap:4px}
.lt860 .ag-i{white-space:nowrap;width:auto}
.lt860 .ins{grid-template-columns:minmax(0,1fr)}
.lt860 .ins .k{order:-1}
.lt860 .tr-l{grid-template-columns:minmax(0,1fr);gap:2px}
.lt860 .m-u{max-width:90%}
.lt860 .drawer{width:100%}
.lt860 .hello h2{font-size:23px}
.lt860 .page-h h2{font-size:21px}
.lt860 .cmp-r{grid-template-columns:78px minmax(0,1fr) 64px}
.lt860 .hbar{grid-template-columns:110px minmax(0,1fr) 60px}
.lt860 .evi-r{grid-template-columns:minmax(0,1fr) auto}
.lt860 .evi-r .src-c{display:none}
.lt1280 .hub{grid-template-columns:1fr 1fr}
.lt1100 .lg-l{padding:40px}
.lt1100 .lg-l h1{font-size:32px}
.lt860 .login{grid-template-columns:minmax(0,1fr)}
.lt860 .lg-l{display:none}
.lt860 .lg-r{padding:32px 20px;align-items:flex-start}
.lt860 .ws-cards,.lt860 .hub,.lt860 .myapps{grid-template-columns:minmax(0,1fr)}
.lt860 .ws-page{padding:28px 16px}
.lt860 .ashell{grid-template-columns:minmax(0,1fr)}
.lt860 .aside{position:fixed;top:var(--stick);left:0;bottom:0;height:auto;width:min(272px,86%);transform:translateX(-102%);transition:transform .22s;box-shadow:var(--shadow-lg)}
.lt860 .aside.open{transform:none;z-index:72}
.lt860 .gtab.tabs{display:none}
.lt860 .gbar{padding:0 8px}
.lt860 .ahead{padding:12px 16px}
.lt860 .acontent{padding:16px 16px 32px}
.lt860 .inbox{grid-template-columns:minmax(0,1fr)}
.lt860 .conv-l{border-right:0;border-bottom:1px solid var(--line)}
.lt860 .sw-btn .t{display:none}
.lt860 .acontent .kb-wrap{margin:0 -16px!important;padding:0 16px 6px!important}
.lt420 .top [data-a="bell"]{display:none}
.lt420 .kpis,.lt420 .money{grid-template-columns:minmax(0,1fr)}
.lt420 .m-a{grid-template-columns:minmax(0,1fr)}
.lt420 .m-a .ceo-av{display:none}
.lt420 .top .avatar{display:none}
/* ================= V3 · menos interface, mais clareza ================= */
.shell.mini{grid-template-columns:72px minmax(0,1fr)}
.shell.mini .side{padding:14px 10px}
.shell.mini .brand{flex-direction:column;gap:8px;padding:2px 0 12px}
.shell.mini .side .nt,.shell.mini .side .ws,.shell.mini .side .nav-sec,.shell.mini .co-sel .meta,.shell.mini .co-sel>.ico,.shell.mini .plan,.shell.mini .user .meta,.shell.mini .brand .n,.shell.mini .lk,.shell.mini .cnt{display:none}
.shell.mini .nav-i{justify-content:center;padding:9px}
.shell.mini .co-sel{justify-content:center;padding:6px}
.shell.mini .user{flex-direction:column;padding:6px 0}
.shell.mini .nav{gap:4px;margin-bottom:10px}
.brand .collapse{margin-left:auto;width:30px;height:30px}
.side .nav-sec{padding:12px 10px 4px}
.top{gap:10px}
/* Pollo CEO (home) */
.ceo{max-width:800px;margin:0 auto;width:100%;display:grid;gap:18px;align-content:start}
.ceo-id{display:flex;gap:14px;align-items:center}
.ceo-id .ceo-av{width:44px;height:44px;border-radius:13px;font-size:13px}
.ceo-id h2{font-size:24px;font-weight:800;line-height:1.2}
.brief3{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.brief3-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;font-weight:700;font-size:13.5px}
.brief3-h .chev{margin-left:auto;color:var(--ink-3);transition:transform .2s}
.brief3-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.b3{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.b3:hover{background:var(--bg)}
.b3 .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.b3 .k i{width:8px;height:8px;border-radius:2px;display:block}
.b3 .t{font-size:14px}
.b3 .s{font-size:11.5px;color:var(--ink-3);display:block;margin-top:2px}
.b3 .go{font-size:12.5px;font-weight:600;color:var(--brand-ink);display:inline-flex;align-items:center;gap:4px}
.legend-btn{font-size:12px;color:var(--ink-3);display:inline-flex;gap:5px;align-items:center}
/* resposta v3 */
.concl{padding:14px 16px;font-size:14.5px;line-height:1.55;display:grid;gap:8px}
.concl .badges{display:flex;gap:6px;flex-wrap:wrap}
.why-b{padding:0 16px 14px;display:grid;gap:8px;font-size:13.5px}
.why-b ul{margin:0;padding-left:18px;display:grid;gap:5px}
.evi-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.evi-btn:hover{background:var(--bg);color:var(--ink)}
.recs{display:grid;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.recs .lbl{margin-bottom:2px}
.rec{border:1px solid var(--line);border-radius:11px;padding:12px;display:grid;gap:9px;background:var(--surface)}
.rec b{font-size:13.5px}
.ev-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.ev-row:first-child{border-top:0}
/* páginas enxutas */
.page{max-width:1080px;width:100%;margin:0 auto;display:grid;gap:20px;align-content:start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{height:42px;padding:0 14px;border-bottom:2px solid transparent;font-size:13.5px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.cur{border-bottom-color:var(--brand);color:var(--ink);font-weight:700}
.tab .n{font-size:11px;font-weight:700;background:var(--sand);border-radius:999px;padding:0 7px;line-height:18px}
.insight{display:grid;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0;padding-top:0}
.insight:last-child{padding-bottom:0}
.insight b{font-size:14.5px}
.meta-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctx-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);font-size:13px}
.prio{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.prio:first-child{border-top:0;padding-top:0}
.prio .n{width:22px;height:22px;border-radius:7px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.more-btn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px 0}
/* agentes */
.ag-sum{display:flex;gap:8px;flex-wrap:wrap}
.ag-group{display:grid;gap:0}
.ag-group h4{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:6px 0 8px;display:flex;align-items:center;gap:8px}
.ag-group h4 i{width:8px;height:8px;border-radius:2px;display:block}
.ag-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) 168px minmax(0,1.2fr) 18px;gap:14px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;text-align:left;margin-bottom:8px}
.ag-row:hover{border-color:var(--ink-3)}
.ag-row .t1{font-weight:700;font-size:13.5px}.ag-row .t2{font-size:12px;color:var(--ink-2)}
.st3{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;padding:3px 9px;border-radius:999px;background:var(--gray-soft)}
.lane{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) 168px minmax(0,1.2fr);gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.lane:first-child{border-top:0}
.lane .fromto{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600}
.lane .fromto span{padding:3px 8px;border-radius:7px;background:var(--sand);font-size:12px}
/* decisões */
.dq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:16px 0;border-top:1px solid var(--line);align-items:start;width:100%;text-align:left}
.dq:first-child{border-top:0;padding-top:4px}
.dq b{font-size:14.5px}
.dq .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px;font-size:12.5px;margin-top:8px}
.dq .grid4 span{color:var(--ink-3);display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
/* Segundo Cérebro */
.brain{display:grid;grid-template-columns:172px 300px minmax(0,1fr);border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;min-height:600px;box-shadow:var(--shadow)}
.br-nav{border-right:1px solid var(--line);padding:12px 10px;display:grid;gap:2px;align-content:start;background:var(--bg)}
.br-nav .nav-i .cnt{background:var(--sand-2);color:var(--ink-2)}
.br-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.br-search{padding:12px;border-bottom:1px solid var(--line)}
.br-search .inp{height:36px}
.br-item{display:grid;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.br-item:hover{background:var(--bg)}
.br-item.cur{background:var(--brand-soft)}
.br-item .t1{font-weight:600;font-size:13.5px}
.br-item .t2{font-size:12px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{padding:24px 28px;display:grid;gap:16px;align-content:start;min-width:0}
.note h2{font-size:22px;font-weight:800}
.note .nbody{display:grid;gap:8px;font-size:14px;line-height:1.6}
.wl{color:var(--brand-ink);font-weight:600;text-decoration:underline;text-decoration-color:rgba(202,110,35,.4);text-underline-offset:3px;text-align:left}
.wl:hover{text-decoration-color:var(--brand)}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.path .p{padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3)}
.path .p.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.path .p.now{background:var(--brand);color:var(--white);border-color:var(--brand)}
.links3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lk-box{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;align-content:start;font-size:13px}
svg.graph{width:100%;height:auto;display:block}
svg.graph text{font-size:11.5px;fill:var(--ink-2);font-family:var(--font-b)}
svg.graph .nd{cursor:pointer}
/* integrações */
.ig{display:grid;gap:0}
.ig-row{display:grid;grid-template-columns:36px minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.ig-row:first-of-type{border-top:0}
.ig-row .tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--white)}
.ig-row .tile.off{background:var(--sand-2)!important;color:var(--ink-3)}
/* consumo */

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const r=x/p;return (r<=1?1:r<=2?2:r<=5?5:10)*p}
function lineChart(series,labels,o={}){
  const W=640,H=o.h||210,pl=38,pr=14,pt=14,pb=26;let max=Math.max(...series.flatMap(s=>s.v));const st=niceStep(max/4);max=Math.ceil(max/st)*st;
  const x=i=>pl+i*(W-pl-pr)/(labels.length-1),y=v=>pt+(H-pt-pb)*(1-v/max);let g='';
  for(let k=0;k<=max+1e-9;k+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(k)}" y2="${y(k)}" stroke="var(--line)" stroke-dasharray="${k?'3 4':''}"/><text x="${pl-8}" y="${y(k)+4}" text-anchor="end">${k}${o.u||''}</text>`;
  labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${l}</text>`);
  series.forEach(s=>{const p=s.v.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);if(s.fill)g+=`<path d="M${p[0]} L${p.join(' L')} L${x(s.v.length-1)},${y(0)} L${x(0)},${y(0)} Z" fill="${s.c}" opacity=".08"/>`;
    g+=`<path d="M${p.join(' L')}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 5"':''}/>`;const li=s.v.length-1;g+=`<circle cx="${x(li)}" cy="${y(s.v[li])}" r="4.5" fill="var(--surface)" stroke="${s.c}" stroke-width="2.4"/>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||''}">${g}</svg>`;
}

}
function actions(m){
  const f=S.flow,d=dec('D-014');

  return `<div class="ans-act">${b('sources','Ver fontes','eye',f.sources)}${b('investigate','Investigar','search',f.investigated)}${b('plan','Preparar plano','file',f.plan)}${b('saveDec','Salvar como rascunho','flag',!!d)}${b('sendApproval','Enviar para aprovação','send',d&&d.s!=='Proposta')}</div>`;
}
function answer(m){
  const top=(t,srcs)=>`<div class="ans-top"><b>${t}</b><span class="faint" style="font-size:12px">${D.per}</span><span style="flex:1"></span>${srcs.map(s=>srcChip(s)).join('')}</div>`;
  if(m.kind==='main'){
    const concl=`<div>${ep('fato')} Os leads subiram 18% (120 → 142), mas as vendas atribuídas caíram de 5 para 4, e a conversão foi de 4,2% para 2,8%.</div><div>Com os dados disponíveis, <b>não dá para afirmar a causa</b>. O sinal mais forte é operacional: a primeira resposta ficou mais lenta (27 → 42 min), principalmente nos leads de portais.</div>`;
    const evid=`<div class="evi">${[['Leads','120 → 142','+18%','ff'],['Vendas atribuídas','5 → 4','−1','ff'],['Conversão','4,2% → 2,8%','−1,4 p.p.','fi'],['Primeira resposta','27 → 42 min','+15 min','ff'],['Visitas agendadas','26 → 23','−3','ff'],['Propostas emitidas','7 → 6','−1','ff'],['Investimento em mídia','R$ 3.100 → R$ 3.800','+23%','ads']].map(([n,v,d,s])=>`<div class="evi-r"><span>${ep('fato','')} ${n}</span><span class="num"><b>${v}</b> <span class="delta faint">${d}</span></span><span class="src-c">${srcChip(s)}</span></div>`).join('')}</div>
      <div class="caveat">${ic('info','sm')}<span>Comparação: ${D.per} contra ${D.prev} completo. Outubro teve 31 dias; o mês atual ainda não terminou. ${srcChip('erp')}: sem dados de receita.</span></div>`;
    const hyp=`<div class="hyp">${ep('hip')}<b>H1 · A demora no primeiro atendimento reduz as visitas</b><span class="muted" style="font-size:13px">As duas coisas pioraram juntas. Isso é correlação, não prova de causa.</span></div>
      <div class="hyp">${ep('hip')}<b>H2 · Os leads novos da Meta têm menos intenção de compra</b><span class="muted" style="font-size:13px">61 leads da Meta, nenhuma venda no período. O ciclo de venda médio é de 38 dias, então ainda pode ser cedo.</span></div>
      <div class="hyp">${ep('hip')}<b>H3 · Parte das vendas de novembro vai fechar em dezembro</b><span class="muted" style="font-size:13px">Há 6 propostas em aberto. Só o fechamento do mês confirma ou descarta.</span></div>`;
    const rec=`<div>${ep('rec')}</div><div>Testar um procedimento de triagem em parte dos leads de portais por duas semanas, medindo tempo de resposta, visitas e conversão. Registrar a decisão e pedir aprovação antes de alterar qualquer fluxo do FlipForm.</div>`;
    const next=`<ol><li>Investigar o tempo de resposta por origem do lead.</li><li>Preparar o plano do teste com métrica de sucesso.</li><li>Enviar a proposta para aprovação.</li><li>Revisar o resultado na reunião semanal de 04/12.</li></ol>`;
    let inner='';
    if(S.mode==='curta')inner=sec(m,'c','Conclusão','flag',concl)+`<div class="sec"><div class="sec-b" style="padding-top:12px"><span class="faint" style="font-size:12.5px">Resposta curta. Mude para "Aprofundada" para ver evidências, hipóteses e próximos passos.</span></div></div>`;
    else if(S.mode==='indicadores')inner=sec(m,'c','Conclusão','flag',concl)+sec(m,'i','Funil · atual x anterior','chart',`<div class="legend2"><span><i style="background:var(--fi)"></i>1–20/11</span><span><i style="background:var(--line-2)"></i>Outubro</span></div>${cmpBars(D.funil)}`)+sec(m,'t','Primeira resposta por semana (min)','clock',lineChart([{v:D.respW,c:'var(--warn)',fill:1}],D.weeks,{u:'',label:'Tempo de primeira resposta por semana'}));
    else inner=sec(m,'c','Conclusão','flag',concl)+sec(m,'e','Evidências','check',evid)+sec(m,'h','Hipóteses','alert',hyp)+sec(m,'r','Recomendações','spark',rec)+sec(m,'n','Próximos passos','list',next);
    return `<div class="ans">${top('Mais leads, menos vendas',['ff','fi'])}${inner}${actions(m)}</div>`;
  }
  if(m.kind==='investigate'){
    const rows=D.origem.map(([n,l,r,v,s])=>`<tr><td><b>${n}</b></td><td class="r num">${l}</td><td class="r num" style="${r>60?'color:var(--err);font-weight:700':''}">${r} min</td><td class="r num">${v} (${Math.round(v/l*100)}%)</td><td class="r num">${s}</td></tr>`).join('');
    return `<div class="ans">${top('Investigação · primeira resposta por origem',['ff'])}
      ${sec(m,'t','Dados por origem','chart',`<div style="overflow-x:auto;border:1px solid var(--line);border-radius:10px"><table><thead><tr><th>Origem</th><th class="r">Leads</th><th class="r">1ª resposta</th><th class="r">Visitas</th><th class="r">Vendas</th></tr></thead><tbody>${rows}</tbody></table></div><span class="faint" style="font-size:12px">${ep('fato','')} Soma: 142 leads, 23 visitas, 4 vendas · FlipForm, 01–20/11.</span>`)}
      ${sec(m,'l','Leitura','flag',`<div>Portais respondem cerca de 3× mais devagar e têm a menor taxa de visita (14%). Na Meta, o tempo de resposta é bom (31 min) e mesmo assim não houve venda: a demora não explica a Meta.</div><div class="hyp">${ep('hip')}<b>H1 se sustenta para portais, não para a Meta.</b><span class="muted" style="font-size:13px">Continua sendo correlação. Um teste com grupo de controle separa o efeito da resposta rápida de outros fatores, como o tipo de imóvel anunciado.</span></div>`)}
      ${sec(m,'d','Desenho de teste sugerido','spark',`<div>${ep('rec')}</div><ul><li>Metade dos leads de portais recebe triagem e resposta em até 15 min; a outra metade segue como hoje.</li><li>Duas semanas, de 23/11 a 06/12.</li><li>Medir: primeira resposta, taxa de visita e propostas. Conversão só tem leitura confiável depois do ciclo de venda.</li></ul>`)}
      ${actions(m)}</div>`;
  }

function simOut(){const s=S.sim;const ia=s.int*s.cham*s.cpc,voz=s.voz*s.cvoz,per=ia+voz,tot=per*s.emp,rec=s.mens*s.emp,pc=rec?tot/rec*100:0;

function viewHtml(){
  if(S.loadingCo)return `<div class="stack"><div class="sk" style="height:30px;width:60%"></div><div class="sk" style="height:120px"></div><div class="sk" style="height:80px"></div><span class="faint" style="font-size:12px">Trocando de empresa: carregando somente o contexto de ${C().n}…</span></div>`;
  return ({apps:vApps,home:vHome,chat:vChat,reunioes:vMeet,agentes:vAgents,intel:vIntel,decisoes:vDecisions,memoria:vMemory,integracoes:vIntegr,consumo:vUsage,config:vConfig,guia:vGuide})[S.view]();
}
function render(){
  const sc=document.querySelector('.phone-scroll');const prev=sc?sc.scrollTop:0;
  const dr=document.querySelector('.drawer-b');const prevDr=dr?dr.scrollTop:0;
  document.getElementById('pv').innerHTML=pvBar();
  const stage=document.getElementById('stage');stage.className='stage'+(S.mobile?' phone':'');
  const w=S.mobile?Math.min(370,document.documentElement.clientWidth-52):document.documentElement.clientWidth;
  S._narrow=w<=860;
  const wc=[1280,1100,860,420].filter(b=>w<=b).map(b=>'lt'+b).join(' ');
  const withCtx=['home','chat'].includes(S.view);
  let inner;
  if(S.auth==='login'||S.auth==='checking'||S.auth==='checking2'||S.auth==='ready')inner=S.auth==='ready'&&S._wasWs?vWorkspaces():vLogin();
  else if(S.auth==='ws')inner=vWorkspaces();
  else if(S.app==='ff')inner=ffApp();
  else if(S.app==='fi')inner=fiApp();
  else inner=`<div class="shell">${S.navOpen?'<div class="scrim" data-a="navClose"></div>':''}${sidebar()}<div class="main">${topbar()}<div class="body ${withCtx?'':'noctx'}"><main class="center">${viewHtml()}</main>${withCtx?ctxPanel():''}</div></div></div>`;
  const app=`<div class="app ${wc}" id="app">${inner}${overlays()}</div>`;
  stage.innerHTML=S.mobile?`<div class="phone-frame"><div class="phone-scroll">${app}</div></div>`:app;
  const nsc=document.querySelector('.phone-scroll');
  if(S._top){S._top=false;if(nsc)nsc.scrollTop=0;else window.scrollTo(0,0)}
  else if(S._end){S._end=false;if(nsc)nsc.scrollTop=nsc.scrollHeight;else window.scrollTo(0,document.body.scrollHeight)}
  else if(nsc)nsc.scrollTop=prev;
  const ndr=document.querySelector('.drawer-b');if(ndr&&prevDr)ndr.scrollTop=prevDr;
  if(S._focus){const f=document.getElementById(S._focus);if(f){f.focus({preventScroll:true});if(f.setSelectionRange)f.setSelectionRange(f.value.length,f.value.length)}S._focus=null}
}

function go(v){S.view=v;S.navOpen=false;S._top=true;S.viewAta=null}
function keepLogin(){const m=document.getElementById('lg-mail');if(m)S.lg.mail=m.value}
function doLogin(){
  const mail=(document.getElementById('lg-mail').value||'').trim(),pass=document.getElementById('lg-pass').value||'';
  S.lg.mail=mail;S.lg.err={};S.lg.bad=false;S.lg.forgot=false;
  if(!mail)S.lg.err.mail='Informe seu e-mail.';else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail))S.lg.err.mail='Digite um e-mail válido.';
  if(!pass)S.lg.err.pass='Informe sua senha.';
  if(S.lg.err.mail||S.lg.err.pass){render();return}

function vMemory(){

  if(!ns.length)return `<div class="page">${pageH('O que o sistema sabe sobre a empresa?','Segundo Cérebro')}${emptyState('book','Nenhuma nota ainda para '+C().n,'Comece adicionando como a empresa trabalha. Cada nota passa por validação antes de ser usada pelo Pollo CEO.',`<button class="btn primary" data-a="addNote">${ic('plus','sm')}Adicionar conhecimento</button>`)}</div>`;
  const list=ns.filter(n=>(S.brainCat==='Biblioteca'||n.cat===S.brainCat)&&(!q||(n.t+' '+n.sum).toLowerCase().includes(q)));
  const n=ns.find(x=>x.id===S.note)||ns[0];
  const stc={Validado:'ok',Pendente:'warn',Obsoleto:'err'};
  const citedBy=ns.filter(x=>x.links.includes(n.id));

  <span class="faint" style="font-size:12px">Os passos se marcam sozinhos conforme você navega.</span>
  ${T9.map(([k,t],i)=>`<div class="rt ${tDone(k)?'done':''}"><span class="c">${tDone(k)?ic('check','xs'):i+1}</span><span>${t}</span></div>`).join('')}
  <div class="row wrap"><button class="btn primary xs" data-a="setProfile" data-v="marina">Entrar como Marina</button><button class="btn line xs" data-a="setProfile" data-v="bruno">Como atendente</button><button class="btn line xs" data-a="setProfile" data-v="patricia">Com 2 empresas</button></div></div>`}
function pvBar(){const n=T9.filter(t=>tDone(t[0])).length;
  return `<div class="pv-in"><span class="pv-tag"><i></i>Prévia conceitual · Pollo OS V3</span><span class="pv-sep"></span><span style="color:#C9BCAE">Dados demonstrativos · login e integrações simulados</span><span class="pv-sep"></span>
  <button class="pv-btn" data-a="prof" aria-pressed="${S.prof}">${ic('users','sm')}Perfil de teste: <b>${PROF().n.split(' ')[0]}</b></button>
  <button class="pv-btn" data-a="roteiro" aria-pressed="${S.roteiro}">${ic('list','sm')}Testes <b>${n}/9</b></button>
  <button class="pv-btn" data-a="mobile" data-v="0" aria-pressed="${!S.mobile}" aria-label="Computador">${ic('monitor','sm')}</button><button class="pv-btn" data-a="mobile" data-v="1" aria-pressed="${S.mobile}" aria-label="Celular">${ic('phone','sm')}</button>
  <button class="pv-btn" data-a="nav" data-v="guia">${ic('info','sm')}Guia</button></div>`}

/* ---------- Render ---------- */
function viewHtml(){
  if(S.loadingCo)return `<div class="stack"><div class="sk" style="height:30px;width:60%"></div><div class="sk" style="height:120px"></div></div>`;
  return ({home:vCEO,chat:vCEO,exec:vExec,apps:vApps,reunioes:vMeet,agentes:vAgents,intel:vIntel,decisoes:vDecisions,memoria:vMemory,integracoes:vIntegr,consumo:vUsage,config:vConfig,guia:vGuide}[S.view]||vCEO)();
}
function overlays(){
  let h='';
  if(S.drawer){const[t,id]=S.drawer;h+=t==='src'?sourcesDrawer():t==='agent'?agentDrawer(id):t==='dec'?decDrawer(id):t==='evid'?evidDrawer():t==='conn'?connDrawer(id):''}
  if(S.modal==='plan')h+=planModal();
  if(S.modal==='cmd')h+=cmdPalette();
  if(S.modal==='meet')h+=meetSetupModal();
  if(S.modal==='graph')h+=graphModal();
  if(S.modal==='addNote')h+=addNoteModal();
  if(S.modal==='plano'||S.modal==='denied')h+=accessModal();
  if(S.modal==='how')h+=howModal();
  if(S.modal==='expired')h+=expiredModal();
  if(S.auth==='ready')h+=readyOverlay();
  if(S.opening)h+=`<div class="opening" role="status"><div class="ready-box"><span class="tile-app" style="width:48px;height:48px;border-radius:14px;background:${APPS[S.opening].c}">${ic(APPS[S.opening].i,'lg')}</span><b>Abrindo ${S.opening==='os'?'o Pollo CEO':APPS[S.opening].n}</b><span class="faint" style="font-size:12.5px">Mesma sessão · sem novo login</span></div></div>`;
  if(S.roteiro)h+=roteiroPop();
  if(S.prof)h+=profPop();
  if(S.toast)h+=`<div class="toast" role="status">${ic('check','sm')}${S.toast}</div>`;
  return h;
}
function render(){
  const sc=document.querySelector('.phone-scroll');const prev=sc?sc.scrollTop:0;
  const dr=document.querySelector('.drawer-b');const prevDr=dr?dr.scrollTop:0;
  document.getElementById('pv').innerHTML=pvBar();
  const stage=document.getElementById('stage');stage.className='stage'+(S.mobile?' phone':'');
  const w=S.mobile?Math.min(370,document.documentElement.clientWidth-52):document.documentElement.clientWidth;
  S._narrow=w<=860;
  const wc=[1280,1100,860,420].filter(b=>w<=b).map(b=>'lt'+b).join(' ');
  let inner;
  if(['login','checking','ready'].includes(S.auth))inner=S.auth==='ready'&&S._wasWs?vWorkspaces():vLogin();
  else if(S.auth==='ws')inner=vWorkspaces();
  else if(S.app==='ff')inner=ffApp();
  else if(S.app==='fi')inner=fiApp();
  else inner=`<div class="shell ${S.collapsed&&!S._narrow?'mini':''}">${S.navOpen?'<div class="scrim" data-a="navClose"></div>':''}${sidebar()}<div class="main">${topbar()}<div class="body noctx"><main class="center">${viewHtml()}</main></div></div></div>`;
  stage.innerHTML=S.mobile?`<div class="phone-frame"><div class="phone-scroll"><div class="app ${wc}" id="app">${inner}${overlays()}</div></div></div>`:`<div class="app ${wc}" id="app">${inner}${overlays()}</div>`;
  const nsc=document.querySelector('.phone-scroll');
  if(S._top){S._top=false;if(nsc)nsc.scrollTop=0;else window.scrollTo(0,0)}
  else if(S._end){S._end=false;if(nsc)nsc.scrollTop=nsc.scrollHeight;else window.scrollTo(0,document.body.scrollHeight)}
  else if(nsc)nsc.scrollTop=prev;
  const ndr=document.querySelector('.drawer-b');if(ndr&&prevDr)ndr.scrollTop=prevDr;
  if(S._focus){const f=document.getElementById(S._focus);if(f){f.focus({preventScroll:true});if(f.setSelectionRange)try{f.setSelectionRange(f.value.length,f.value.length)}catch(e){}}S._focus=null}
}

/* ---------- Ações V3 ---------- */
Object.assign(ACT,{
  nav:v=>{readDraft();go(v);if(v==='home')track()},
  collapse:()=>{S.collapsed=!S.collapsed},
  briefT:()=>{const ch=S.chat[S.company];const cur=S.briefOpen===null?!ch.length:S.briefOpen;S.briefOpen=!cur},
  legend:()=>{S.legend=!S.legend},
  evid:()=>{readDraft();S.drawer=['evid']},
  toAnalytics:()=>{S.drawer=null;S.anCtx='mais leads, menos vendas';S._keepCtx=true;S.anTab='Operação';go('intel')},
  discuss:()=>{S.t.t2=S.t.t2||!!S.anCtx||true;go('home');S._top=false;mock.ask(QMAIN,[],`Da Visão Analítica · aba ${S.anTab} · 01–20/11`);return 'rendered'},
  discussExec:()=>{go('home');S._top=false;mock.ask(QMAIN,[],'Da Visão Executiva · conversão 2,8% · 01–20/11');return 'rendered'},
  investigate3:(v,el)=>{S.t.t2=1;go('home');S._top=false;mock.ask(v,[],el&&el.dataset.c);return 'rendered'},
  anTab:v=>{S.anTab=v},
  agView:v=>{S.agView=v},
  askAgent:v=>{const a=AGENTS.find(x=>x.id===v);S.drawer=null;go('home');S._top=false;S._askAgent=v;mock.ask(`O que o agente ${a.n} entregou e o que falta?`,[],`De Agentes & Operações · ${a.n}`);return 'rendered'},
  decTab:v=>{S.decTab=v},
  askApprove:()=>{if(S.role!=='admin'){toast('Só a proprietária pode aprovar. Você pode pedir ajuste.');return}S.confirm={id:S.drawer[1],k:'approve'}},
  askReject:()=>{S.confirm={id:S.drawer[1],k:'reject'}},
  askAdjust:()=>{S.confirm={id:S.drawer[1],k:'adjust'}},
  doAdjust:()=>{const d=dec(S.confirm.id);const why=(document.getElementById('adj-why')||{}).value||'';d.s='Proposta';audit(d,PROF().n,'Pediu ajuste · '+why);S.confirm=null;syncAgents();toast(`${d.id} voltou para ajuste (simulação).`)},
  doApprove:()=>{const d=dec(S.confirm.id);d.s='Aprovada';d.fresh=1;audit(d,PROF().n,'Aprovou (confirmação explícita)');S.confirm=null;
    if(d.id==='D-014'){S.flow.approved=1;const n=S.notes.horizonte.find(x=>x.id==='n6');if(n){n.st='Validado';n.step=4;n.body=['Proposta criada pelo Pollo CEO a partir da conversa de 20/11.',`Aprovada por ${PROF().n} em 20/11. Ainda não executada: a equipe configura a triagem em 23/11.`,'Resultado: ainda não medido.'];S._approvedNote=1}}
    syncAgents();toast(`${d.id} aprovada nesta simulação. Nada foi executado.`)},
  doReject:()=>{const d=dec(S.confirm.id);const why=(document.getElementById('rj-why')||{}).value||'';d.s='Rejeitada';audit(d,PROF().n,'Recusou · '+why);S.confirm=null;syncAgents();toast(`${d.id} recusada nesta simulação.`)},
  blockedExec:()=>{const d=dec(S.drawer[1]);audit(d,'Pollo OS','Tentativa de marcar execução bloqueada: execução real desligada');toast('Execução real desligada nesta prévia.')},
  brainCat:v=>{S.brainCat=v;S.noteOpen=false},
  note:v=>{S.drawer=null;S.modal=null;if(S.view!=='memoria')go('memoria');S.note=v;S.noteOpen=true;const n=NOTES().find(x=>x.id===v);if(n&&n.cat!==S.brainCat&&S.brainCat!=='Biblioteca')S.brainCat='Biblioteca';if(v==='n6'&&S._approvedNote)S.t.t4=1},
  noteBack:()=>{S.noteOpen=false},
  graph:()=>{S.modal='graph';S._graphSeen=1},
  askNote:v=>{const n=NOTES().find(x=>x.id===v);if(S._graphSeen)S.t.t5=1;go('home');S._top=false;S._askNote=v;mock.ask(`Sobre a nota "${n.t}": posso usar isso nas decisões?`,[],`Do Segundo Cérebro · ${n.t}`);return 'rendered'},
  addNote:()=>{S.modal='addNote'},
  doAddNote:()=>{const t=document.getElementById('nn-t').value||'Nova nota',c=document.getElementById('nn-c').value,s=document.getElementById('nn-s').value||'';const id='n'+Date.now();NOTES().unshift({id,t,cat:c,sum:s,src:'Adicionado por '+PROF().n,resp:PROF().n,rev:'20/11/2026',st:'Pendente',links:[],body:[s],step:0});if(!S.notes[S.company])S.notes[S.company]=NOTES();S.modal=null;S.note=id;S.noteOpen=true;S.brainCat='Biblioteca';toast('Nota criada como "Pendente de validação".')},
  validateNote:v=>{const n=NOTES().find(x=>x.id===v);n.st='Validado';n.rev='20/11/2026';n.step=Math.max(n.step,1);toast(`"${n.t}" validada por ${PROF().n} (simulação).`)},
  conn:v=>{S.drawer=['conn',v]},
  sec:v=>{readDraft();S.sec[v]=!S.sec[v]},
  company:v=>{if(v===S.company)return;S.t.t8=1;S.anCtx=null;S.note='n1';S.noteOpen=false;S.brainQ='';S._wasWs=false;S.deep=S.app==='os'?null:S.app;enterTenant(v);return 'rendered'},
  mobile:v=>{S.mobile=v==='1';if(S.mobile)S.t.t9=1;S._top=true}
});
/* mock.ask: guarda contexto de nota/agente na mensagem */
const _ask=mock.ask;
mock.ask=function(text,att=[],ctx=null){const ch=S.chat[S.company];const n0=ch.length;_ask(text,att,ctx);const note=S._askNote,ag=S._askAgent;S._askNote=null;S._askAgent=null;
  setTimeout(()=>{const m=ch.slice(n0).find(x=>x.role==='a');if(m){if(note)m.note=note;if(ag)m.agent=ag;if(m.kind==='main'||m.kind==='investigate')syncAgents();render()}},760)};
document.addEventListener('input',e=>{if(e.target.id==='brain-q'){S.brainQ=e.target.value;S._focus='brain-q';render()}});
document.addEventListener('change',e=>{if(e.target.dataset.change==='brainCat'){S.brainCat=e.target.value;render()}});

let lastW=0,rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{const w=document.documentElement.clientWidth;if(w!==lastW){lastW=w;render()}},120)});
lastW=document.documentElement.clientWidth;
render();
</script>
